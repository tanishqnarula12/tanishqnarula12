name: Deploy contribution city

on:
  push:
    branches: [main]
    paths:
      - "city/**"
      - "assets/contribution-city-data.json"
      - "assets/contribution-city.svg"
      - ".github/workflows/deploy-contribution-city.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Prepare GitHub Pages site
        run: |
          mkdir -p dist/assets
          cp -R city dist/city
          cp assets/contribution-city-data.json assets/contribution-city.svg dist/assets/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
