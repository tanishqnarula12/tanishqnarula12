<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Contribution City visual preview</title>
<desc id="desc">A decorative isometric neon city made of cyan and emerald blocks. This artwork is a preview and does not encode contribution counts.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="410" gradientUnits="userSpaceOnUse"><stop stop-color="#07111B"/><stop offset=".55" stop-color="#0B1B25"/><stop offset="1" stop-color="#101D24"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4DE7F2"/><stop offset="1" stop-color="#148DA8"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70F0B0"/><stop offset="1" stop-color="#15956A"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#849CFF"/><stop offset="1" stop-color="#4D5DAD"/></linearGradient>
  <pattern id="grid" width="42" height="24" patternUnits="userSpaceOnUse" patternTransform="skewY(-28)"><path d="M42 0H0V24" fill="none" stroke="#66D8E5" stroke-opacity=".12"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1200" height="410" rx="24" fill="url(#bg)"/>
<circle cx="880" cy="200" r="180" fill="#18C7C9" opacity=".08" filter="url(#glow)"/>
